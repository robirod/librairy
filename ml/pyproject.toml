[project]
name = "librairy-ml"
version = "0.1.0"
description = "Librairy — Deep Learning Audio Classification & Embedding Pipeline"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
train = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "librosa>=0.10",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    "onnx>=1.14",
    "onnxruntime>=1.16",
    "tensorboard>=2.14",
    "transformers>=4.35",  # For CLAP model
]
dev = [
    "pytest>=7.4",
    "black>=23.0",
    "ruff>=0.1",
    "jupyterlab>=4.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

